# Dependabot opens weekly pull requests for the pinned dependencies.
# Minor and patch bumps are grouped into one pull request per ecosystem, so a
# quiet week makes little noise. Major bumps still come one per pull request.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # The Dockerfile base image. The python:3.12-slim tag already receives
  # Python patch releases and Debian security fixes on every rebuild, so no
  # pull request is needed for those. A move to a new Python (3.12 to 3.13) is
  # ignored here on purpose: it must be done by hand, together with the
  # python-version in ci.yml.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
