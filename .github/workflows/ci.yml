name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # A registry path must be lower case, and the repository name is not.
  IMAGE: ghcr.io/${{ github.repository_owner }}/scrobster

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Logic self-check
        run: python test_scrobster.py
      - name: Import and compile every module
        run: |
          python -m compileall -q scrobster
          python -c "from scrobster import app, auth, listener, scrobble, db"

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Lint and render the chart
        run: |
          set -euo pipefail
          helm lint charts/scrobster
          helm lint charts/scrobster --set hostSound.enabled=true \
            --set ingress.enabled=true --set secretEnv.ADMIN_PASSWORD=x
          helm template ci charts/scrobster > /tmp/chart.yaml
          # The pod must never trust Home Assistant's ingress address, which a
          # pod can hold too.
          grep -A1 'name: TRUST_INGRESS' /tmp/chart.yaml | grep -q 'value: "0"'

  docker:
    needs: [test, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # A merge to main releases when __version__ carries a number that has no
      # tag yet. That keeps one number in one place: bump it in the pull
      # request, and the merge publishes the image and the tag together.
      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' scrobster/__init__.py)"
          if ! printf '%s' "${version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "__version__ in scrobster/__init__.py is not x.y.z: '${version}'" >&2
            exit 1
          fi

          release=false
          if [ "${GITHUB_REF}" = "refs/heads/main" ] \
              && [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v${version}" \
                > /dev/null 2>&1; then
              echo "::notice::v${version} is already released, so nothing is tagged." \
                "Bump __version__ to cut the next one."
            else
              release=true
            fi
          fi

          echo "Version: ${version}"
          echo "Release: ${release}"
          {
            echo "version=${version}"
            echo "minor=${version%.*}"
            echo "release=${release}"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Build for this runner first, so the image is proven to start before
      # anything is published.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: scrobster:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A root-owned bind mount is what Home Assistant gives an add-on for
          # /data. A named volume would hide the problem, because it inherits
          # the ownership from the image.
          sudo mkdir -p /tmp/hadata
          sudo chown root:root /tmp/hadata
          docker run -d --name smoke -p 8000:8000 -e LISTEN_ON_START=0 \
            -e ADMIN_PASSWORD=smoke-test-password -v /tmp/hadata:/data scrobster:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/ >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8000/ >/dev/null
          # The API must refuse an anonymous caller.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/status)
          test "$code" = "401" || { echo "expected 401, got $code"; exit 1; }
          # And accept the account made on the first start.
          curl -sf -c /tmp/jar -X POST http://localhost:8000/api/login \
            -H 'content-type: application/json' \
            -d '{"username":"admin","password":"smoke-test-password"}' >/dev/null
          curl -sf -b /tmp/jar http://localhost:8000/api/status > /tmp/status.json
          grep -q '"listening":false' /tmp/status.json
          # The image has to report the version this run may release.
          grep -q "\"version\":\"${VERSION}\"" /tmp/status.json
          docker exec smoke ffmpeg -version >/dev/null
          # The database must exist, or the add-on cannot start.
          sudo test -f /tmp/hadata/scrobster.db
          # The image must not pin the audio settings. A real environment
          # variable outranks /data/options.json, so pinning them here would
          # silently ignore the Home Assistant add-on options.
          if docker run --rm scrobster:ci env \
              | grep -qE '^(AUDIO_BACKEND|AUDIO_DEVICE)='; then
            echo "image pins an audio variable, which hides the add-on options"
            exit 1
          fi
          # PulseAudio input, and the ALSA to PulseAudio plugin, must both exist.
          docker run --rm scrobster:ci ffmpeg -hide_banner -devices 2>&1 | grep -q pulse
          docker run --rm scrobster:ci sh -c \
            'ls /usr/lib/*/alsa-lib/libasound_module_pcm_pulse.so' >/dev/null
          docker rm -f smoke

  # helm template only proves the chart renders. Installing it into a real
  # cluster proves the pod starts, the volume is writable as uid 1000, and
  # the service reaches the app.
  kubernetes:
    needs: [test, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' scrobster/__init__.py)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # A pull request's image is not pushed anywhere, so build it here and
      # hand it to the cluster directly.
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: scrobster:ci
          cache-from: type=gha

      - uses: azure/setup-helm@v4
      # kind's default StorageClass provisions the PVC.
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Install the chart
        run: |
          set -euo pipefail
          kind load docker-image scrobster:ci --name ci
          # pullPolicy Never, so a missing image fails here instead of being
          # fetched from the registry.
          helm install scrobster charts/scrobster \
            --set image.repository=scrobster --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set secretEnv.ADMIN_PASSWORD=kind-test-password \
            --set env.LISTEN_ON_START=0 \
            --wait --timeout 3m

      - name: Smoke test the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          kubectl port-forward svc/scrobster 8000:8000 > /tmp/port-forward.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/ >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8000/ >/dev/null
          # The API must refuse an anonymous caller.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/status)
          test "$code" = "401" || { echo "expected 401, got $code"; exit 1; }
          # And accept the account made from secretEnv.
          curl -sf -c /tmp/jar -X POST http://localhost:8000/api/login \
            -H 'content-type: application/json' \
            -d '{"username":"admin","password":"kind-test-password"}' >/dev/null
          curl -sf -b /tmp/jar http://localhost:8000/api/status > /tmp/status.json
          grep -q '"listening":false' /tmp/status.json
          grep -q "\"version\":\"${VERSION}\"" /tmp/status.json
          # podSecurityContext must hold, and the database must land on the
          # volume rather than fail for want of write access.
          uid=$(kubectl exec deploy/scrobster -- id -u)
          test "$uid" = "1000" || { echo "expected uid 1000, got $uid"; exit 1; }
          kubectl exec deploy/scrobster -- test -f /data/scrobster.db

      - name: Show the pod on failure
        if: failure()
        run: |
          kubectl get all,pvc
          kubectl describe pod -l app.kubernetes.io/instance=scrobster
          kubectl logs -l app.kubernetes.io/instance=scrobster --tail=200 || true
          cat /tmp/port-forward.log || true

  release:
    needs: [docker, kubernetes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5

      # A merge to main releases when __version__ carries a number that has no
      # tag yet. That keeps one number in one place: bump it in the pull
      # request, and the merge publishes the image and the tag together.
      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' scrobster/__init__.py)"
          if ! printf '%s' "${version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "__version__ in scrobster/__init__.py is not x.y.z: '${version}'" >&2
            exit 1
          fi

          release=false
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" \
              > /dev/null 2>&1; then
            echo "::notice::v${version} is already released, so nothing is tagged." \
              "Bump __version__ to cut the next one."
          else
            release=true
          fi

          echo "Version: ${version}"
          echo "Release: ${release}"
          {
            echo "version=${version}"
            echo "minor=${version%.*}"
            echo "release=${release}"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The two raw tags carry the version on a releasing run. A tag pushed by
      # a workflow does not start another one, so the version tags have to be
      # applied here rather than by the tag push at the end. The semver lines
      # still cover a tag pushed by hand.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.release == 'true' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ steps.version.outputs.release == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The chart carries __version__ for both numbers. It is pushed when that
      # version is not published yet, so the first run after the chart was
      # added publishes it, and every release after that.
      - uses: azure/setup-helm@v4
      - name: Publish the Helm chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHARTS: oci://ghcr.io/${{ github.repository_owner }}/charts
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          if helm show chart "${CHARTS}/scrobster" --version "${VERSION}" \
              > /dev/null 2>&1; then
            echo "Chart ${VERSION} is already published."
            exit 0
          fi
          helm package charts/scrobster --version "${VERSION}" \
            --app-version "${VERSION}" --destination /tmp/chart
          helm push "/tmp/chart/scrobster-${VERSION}.tgz" "${CHARTS}"

      # Artifact Hub reads its repository metadata from the "artifacthub.io"
      # tag. Pushed every run, so an edit lands without waiting for a release.
      # oras uses the docker login above.
      - uses: oras-project/setup-oras@v1
      - name: Publish the Artifact Hub metadata
        working-directory: charts/scrobster
        run: >-
          oras push ghcr.io/${{ github.repository_owner }}/charts/scrobster:artifacthub.io
          --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml
          artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      # Last, so a release only ever names a commit whose image is published.
      - name: Tag the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "scrobSter ${VERSION}"
          git push origin "v${VERSION}"
          # --verify-tag, so the release is attached to the tag just pushed
          # rather than creating a second, lightweight one.
          gh release create "v${VERSION}" --verify-tag --generate-notes \
            --title "scrobSter ${VERSION}"
