image:
  repository: ghcr.io/benkelly/scrobster
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Plain settings, passed as environment variables. Every variable in the
# configuration table in docs/configuration.md works here, for example:
#   MATCH_INTERVAL: "20"
#   RECOGNITION_GAP_SECONDS: "5"
#   LISTEN_ON_START: "0"
# TRUST_INGRESS and CREATE_SERVER_MIC_ROOM are set by the chart, and the
# chart refuses them here and in secretEnv.
env: {}

# Settings that hold a secret, kept in a Secret the chart creates. For
# example ADMIN_PASSWORD, LISTENBRAINZ_TOKEN, LASTFM_API_KEY,
# LASTFM_API_SECRET, LASTFM_SESSION_KEY, MALOJA_KEY.
# Without ADMIN_PASSWORD the first start writes a random password to the log.
secretEnv: {}

# Or name a Secret you manage yourself. Each of its keys becomes an
# environment variable, and secretEnv is then ignored.
existingSecret: ""

# One SQLite database holds accounts, rooms and history.
persistence:
  enabled: true
  # Use a claim you made yourself instead of creating one.
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi

# Cameras need nothing here: a room reads RTSP or RTSPS over the network.
# To record from the node's own sound card, mount /dev/snd. Reaching a host
# device needs a privileged container, and the pod has to land on the node
# with the sound card, so pin it with nodeSelector.
hostSound:
  enabled: false
  # The group ID that owns /dev/snd on the node, not a group in the image. The
  # pod is given this ID as a supplemental group so its user may open the
  # card. 29 is the audio group on Debian and Raspberry Pi OS. Find it on the
  # node with: stat -c %g /dev/snd/controlC0
  audioGroup: 29

# Whether a new database starts with the microphone room "Server mic". Empty
# follows hostSound.enabled: a pod with no sound card would only see that room
# fail. true or false overrides it. It sets CREATE_SERVER_MIC_ROOM, which is
# read once, when the database is made, so it never removes the room from an
# existing install.
createServerMicRoom: null

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: scrobster.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: scrobster-tls
  #    hosts:
  #      - scrobster.example.com

resources: {}
#  requests:
#    cpu: 50m
#    memory: 128Mi
#  limits:
#    memory: 512Mi

# The pod restarts by itself when secretEnv changes. A Secret named by
# existingSecret is not read by the chart, so after editing it run
# `kubectl rollout restart`, or change an annotation here, for example
# `secret-version: "2"`, to restart the pod from a values file.
podAnnotations: {}
podLabels: {}

# The image's scrobster user owns /data, and fsGroup gives it a fresh volume.
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
