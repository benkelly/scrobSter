apiVersion: v2
name: scrobster
description: Listens to a microphone or a camera, identifies the music with Shazam, and scrobbles it to Last.fm, Libre.fm, ListenBrainz or Maloja.
type: application
# CI publishes the chart with `helm package --version --app-version` set to
# __version__ from scrobster/__init__.py, so the published chart always
# matches the image. These two numbers matter for a chart installed from a
# checkout, whose image tag defaults to appVersion: keep both equal to
# __version__. CI fails when they differ.
version: 0.7.0
appVersion: "0.7.0"
icon: https://raw.githubusercontent.com/benkelly/scrobSter/main/scrobster/static/icon.png
home: https://github.com/benkelly/scrobSter
sources:
  - https://github.com/benkelly/scrobSter
keywords:
  - scrobbler
  - last.fm
  - listenbrainz
  - shazam
maintainers:
  - name: benkelly
    email: git@benjamin.ie
    url: https://github.com/benkelly
# No artifacthub.io/images: Artifact Hub reads the image from a dry run with
# the default values, which already gives ghcr.io/benkelly/scrobster:<appVersion>.
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: streaming-messaging
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/benkelly/scrobSter
    - name: Documentation
      url: https://github.com/benkelly/scrobSter/blob/main/docs/install.md#kubernetes-helm
