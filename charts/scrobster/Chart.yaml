icon: https://raw.githubusercontent.com/benkelly/scrobSter/main/scrobster/static/icon.png
home: https://github.com/benkelly/scrobSter
sources:
  - https://github.com/benkelly/scrobSter
keywords:
  - scrobbler
  - last.fm
  - listenbrainz
  - shazam
