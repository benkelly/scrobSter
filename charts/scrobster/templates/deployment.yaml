apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scrobster.fullname" . }}
  labels:
    {{- include "scrobster.labels" . | nindent 4 }}
spec:
  # One SQLite database and one queue to Shazam: never run two at once, not
  # even for the length of a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "scrobster.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "scrobster.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if and (not .Values.existingSecret) .Values.secretEnv }}
        # Restart when a secret setting changes.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        {{- if .Values.hostSound.enabled }}
        supplementalGroups: [{{ .Values.hostSound.audioGroup }}]
        {{- end }}
      containers:
        - name: scrobster
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- if .Values.hostSound.enabled }}
            privileged: true
            {{- else }}
            {{- toYaml .Values.securityContext | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PORT
              value: "8000"
            - name: DB_PATH
              value: /data/scrobster.db
            # Home Assistant's ingress address can be a pod address here, and
            # the app would sign its requests in as the owner.
            - name: TRUST_INGRESS
              value: "0"
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | toString | quote }}
            {{- end }}
          {{- if or .Values.existingSecret .Values.secretEnv }}
          envFrom:
            - secretRef:
                name: {{ include "scrobster.secretName" . }}
          {{- end }}
          # `/` needs no sign-in, unlike /api/*.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.hostSound.enabled }}
            - name: snd
              mountPath: /dev/snd
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "scrobster.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.hostSound.enabled }}
        - name: snd
          hostPath:
            path: /dev/snd
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
